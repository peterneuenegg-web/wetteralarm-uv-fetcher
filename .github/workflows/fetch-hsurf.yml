name: fetch-hsurf

# Erzeugt das Geländehöhen-Raster (HSURF, ICON-CH1, 1 km) für das UV-Projekt.
#
# BEWUSST OHNE `schedule:` — zwei Gründe:
#   1. Gelände ist statisch. Ein wiederkehrender Lauf hätte keinen Zweck.
#   2. GitHub deaktiviert in öffentlichen Repos *geplante* Workflows nach
#      60 Tagen ohne Repository-Aktivität. Ohne `schedule:` greift die Regel
#      nicht.
#
# Ergebnis liegt als Artifact bereit: herunterladen, in dieses Repo committen
# UND nach UV/Applikation/data/ kopieren.

on:
  workflow_dispatch:
    inputs:
      grid_km:
        description: "Rasterweite in km"
        required: false
        default: "1.0"
      bbox:
        description: "west,south,east,north (leer = Schweiz-Default)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions auf vollen Commit-SHA gepinnt (Tag-Reuse-Risiko).
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build HSURF raster
        env:
          GRID_KM: ${{ inputs.grid_km }}
          BBOX: ${{ inputs.bbox }}
        run: python fetch_hsurf.py

      - name: Upload raster
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: hsurf-ch
          path: |
            hsurf_ch.bin
            hsurf_ch.json
          if-no-files-found: error
